server {
    listen 80;
    listen [::]:80;
    server_name oceanbrown.gm www.oceanbrown.gm;
    return 301 https://oceanbrown.gm$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.oceanbrown.gm;
    ssl_certificate /etc/letsencrypt/live/oceanbrown.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oceanbrown.gm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://oceanbrown.gm$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oceanbrown.gm;
    ssl_certificate /etc/letsencrypt/live/oceanbrown.gm/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oceanbrown.gm/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 2m;
    location ^~ /admin { return 404; }
    location ^~ /api/auth { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
